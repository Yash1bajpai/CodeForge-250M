name: windows-tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pyyaml numpy tokenizers transformers datasketch tqdm
      - name: Run tests (CPU only, synthetic fixtures)
        env:
          PYTHONUTF8: "1"
          HF_HUB_OFFLINE: "1"
        run: python -m pytest tests -q -rs
