run_id: fresh-20261026-production01
purpose: data-preparation-only
execution_host: kaggle
seed: 42
vocab_size: 32000
seq_length: 2048
validation_fraction: 0.01
max_document_chars: 200000
tokenizer_sample_chars: 80000000
# CPU sessions end well before Kaggle's 12-hour hard limit.
session_seconds: 14400
session_max_tokens: 100000000
shard_sequences: 1000
checkpoint_documents: 500
min_free_bytes: 3000000000
# Targets are future TRAINING allocations, not available unique-data claims.
# No source is repeated automatically to hide a unique-data shortfall.
sources:
  - name: github-code
    stage: foundation
    repo: codeparrot/github-code
    revision: b5661e6b17396364b2bcf8e68977b0d28e1ebd19
    file_pattern: data/*.parquet
    loader: parquet
    text_field: content
    license_field: license
    allowed_licenses: [mit, apache-2.0, bsd-2-clause, bsd-3-clause, isc, cc0-1.0, unlicense]
    language_field: language
    language_from_path: true
    allowed_languages: [Python, JavaScript, TypeScript, Shell, PowerShell, C, C++, GO, Rust, Java, C#, SQL, HTML, CSS, Dockerfile, Markdown]
    python_ast: true
    fim_rate: 0.5
    fim_languages: [Python, JavaScript, TypeScript, Shell, PowerShell, C, C++, GO, Rust, Java, C#, SQL, HTML, CSS, Dockerfile]
    target_tokens: 5950000000
    tokenizer_chars: 56000000
  - name: codeparrot-clean
