# Preparation track only: notify the owner before any model-training launch.
# Stage budgets are targets, not assertions that data is available or unique.
run:
  id: fresh-20261025
  owner: yashbajpai2027
  initialization: random
  target_input_tokens: 10000000000
  deadline: '2027-01-01'
  seed: 42
  stages:
    foundation: 8500000000
    code_instruction: 1000000000
    tool_instruction: 500000000
model:
  name: CodeForge-250M-fresh
  vocab_size: 32000
  hidden_size: 1024
  intermediate_size: 2816
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: false
  use_cache: true
data:
  dataset_name: codeforge-fresh-foundation
  seq_length: 2048
  target_tokens: 8500000000
  languages: [github-code, codeparrot-clean, fineweb-edu]
  language_weights: [0.70, 0.15, 0.15]
  preparation_recipe: configs/fresh_data_production.yaml
training:
  batch_size_per_device: 4
  gradient_accumulation_steps: 64
  total_batch_size_sequences: 256
  learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  warmup_steps: 500
  # ceil(8.5B / (256 * 2047)); exact valid-token accounting gates production.
  max_steps: 16221
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: AdamW
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  precision: bf16
  val_steps: 100
  val_batches: 8
  require_explicit_approval: true
checkpointing:
  save_steps: 100
  save_time_interval_minutes: 20
  output_dir: checkpoints/CodeForge-fresh-20261025
  push_to_hub: true
  hf_repo_id: Yash1bajpai/CodeForge-250M-rotation
  hf_path_prefix: fresh-20261025-session01
logging:
  wandb_project: CodeForge
  wandb_run_name: fresh-20261025-foundation
  log_steps: 5
